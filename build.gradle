plugins {
    id "fabric-loom" version "1.8.+"
    id "maven-publish"
}

base.archivesName = "$archives_base_name-fabric"
group = project.maven_group

// Jar file name mirrors the forge build (Create-Henry-<loader>-<mc>-<modver>-<create>), e.g.
// Create-Henry-fabric-1.20.1-1.0.1-6.0.jar. The mod's own version stays a clean semver (see
// fabric.mod.json / processResources), so this string only shapes the artifact name.
String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = "$minecraft_version-$mod_version-$create" + (buildNumber != null ? "-build.$buildNumber" : "")

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

repositories {
    maven { url = "https://maven.parchmentmc.org" } // Parchment mappings

    maven { url = "https://maven.createmod.net" } // Catnip, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate mirror
    maven { url = "https://mvn.devos.one/releases" } // Porting Lib releases
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate (Create fork) + Porting Lib snapshots
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes (Porting Lib transitive)
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
    maven { url = "https://api.modrinth.com/maven" } // Create Fabric

    maven { // Fabric ASM for Porting Lib
        url = "https://jitpack.io/"
        content { includeGroupAndSubgroups("com.github") }
    }

    maven { url = "https://maven.shedaniel.me" } // Cloth Config, REI
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://maven.terraformersmc.com/releases" } // Mod Menu, EMI
}

loom {
    accessWidenerPath = file("src/main/resources/create_henry.accesswidener")
}

fabricApi {
    configureDataGeneration {
        modId = "create_henry"
        outputDirectory = file("src/generated/resources")
    }
}

loom {
    runs {
        // Porting Lib's ExistingFileHelper needs a directory of existing resources to validate
        // generated model parents against; point it at the main resources source set. The datagen
        // run config itself is created by the fabricApi data generation setup above.
        named("datagen") {
            client()
            property("porting_lib.datagen.existing_resources", file("src/main/resources").absolutePath)
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        // Make sure the desired version of loader is used. Sometimes old versions are pulled in transitively.
        force("net.fabricmc:fabric-loader:$fabric_loader_version")
    }
}

dependencies {
    // Setup
    minecraft("com.mojang:minecraft:$minecraft_version")
    mappings(loom.layered {
        it.officialMojangMappings { nameSyntheticMembers = false }
        it.parchment("org.parchmentmc.data:parchment-$minecraft_version:$parchment_version@zip")
    })
    modImplementation("net.fabricmc:fabric-loader:$fabric_loader_version")
    modImplementation("net.fabricmc.fabric-api:fabric-api:$fabric_api_version")

    // Create Fabric. Its only declared dependency is fabric-api; catnip/ponder/flywheel/registrate
    // are jar-in-jar and not on the compile classpath, so they are declared explicitly below.
    modImplementation("maven.modrinth:create-fabric:$create_version")

    // Create platform libraries (compile-time copies of the bundled JIJ artifacts).
    // Catnip/Ponder declare a flywheel under the (unpublished) dev.engine_room.flywheel group, so the
    // transitive flywheel is excluded and the correct dev.engine-room.flywheel artifacts are pinned below.
    modCompileOnly("net.createmod.catnip:Catnip-Fabric-1.20.1:$catnip_version") {
        exclude group: "dev.engine_room.flywheel"
    }
    modCompileOnly("net.createmod.ponder:Ponder-Fabric-1.20.1:$ponder_version") {
        exclude group: "dev.engine_room.flywheel"
    }
    modCompileOnly("dev.engine-room.flywheel:flywheel-fabric-api-1.20.1:$flywheel_version")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-fabric-1.20.1:$flywheel_version")

    // Registrate (the Create fork Create Fabric 6.0.8 ships, hosted on the devos snapshots maven).
    modCompileOnly("com.tterrag.registrate_fabric:Registrate:$registrate_version")

    // Forge Config API Port: provides net.minecraftforge.common.ForgeConfigSpec on Fabric so the
    // existing config code compiles.
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$forge_config_api_port_version")

    // Porting Lib (fluids / transfer / base / accessors) for later capability + fluid porting.
    modImplementation("io.github.fabricators_of_create.Porting-Lib:fluids:$porting_lib_version")
    modImplementation("io.github.fabricators_of_create.Porting-Lib:transfer:$porting_lib_version")
    modImplementation("io.github.fabricators_of_create.Porting-Lib:base:$porting_lib_version")
    modImplementation("io.github.fabricators_of_create.Porting-Lib:accessors:$porting_lib_version")
    // networking module re-exposes me.pepperbell.simplenetworking (Create's packet base) at compile time.
    modCompileOnly("io.github.fabricators_of_create.Porting-Lib:networking:$porting_lib_version")

    // Create bundles ponder, registrate, the porting_lib runtime modules, and milk-lib via jar-in-jar.
    // Production unpacks them, but dev runs (runClient/runServer/runDatagen) do not, so they are
    // declared explicitly as runtime-only mods.
    modRuntimeOnly("net.createmod.ponder:Ponder-Fabric-1.20.1:$ponder_version") {
        exclude group: "dev.engine_room.flywheel"
    }
    modRuntimeOnly("com.tterrag.registrate_fabric:Registrate:$registrate_version")
    modRuntimeOnly("io.github.fabricators_of_create.Porting-Lib:networking:$porting_lib_version")
    modRuntimeOnly("io.github.fabricators_of_create.Porting-Lib:obj_loader:$porting_lib_version")
    modRuntimeOnly("io.github.fabricators_of_create.Porting-Lib:models:$porting_lib_version")
    modRuntimeOnly("io.github.fabricators_of_create.Porting-Lib:client_events:$porting_lib_version")
    // Create's PotionMixingRecipes needs the brewing module; nothing else pulls it transitively, so
    // without this the create jei plugin crashes in dev with NoClassDefFoundError BrewingRecipeRegistry.
    modRuntimeOnly("io.github.fabricators_of_create.Porting-Lib:brewing:$porting_lib_version")
    modRuntimeOnly("io.github.tropheusj:milk-lib:$milk_lib_version")

    // Development QOL
    modLocalRuntime("com.terraformersmc:modmenu:$modmenu_version")

    // JEI Fabric API on the compile classpath so the HenryJEI plugin + recipe categories always
    // compile, independent of which recipe viewer is enabled at runtime below.
    modCompileOnly("mezz.jei:jei-$minecraft_version-common:$jei_version")
    modCompileOnly("mezz.jei:jei-$minecraft_version-fabric:$jei_version")
    // JEI's API package-info files are annotated with jsr305 @ParametersAreNonnullByDefault; the
    // annotations must be resolvable when javac reads those packages from the JEI plugin.
    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

    // Recipe Viewers - Create Fabric supports JEI, REI, and EMI.
    // See gradle.properties (recipe_viewer) to choose which to use at runtime.
    switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
        case "jei": modLocalRuntime("mezz.jei:jei-$minecraft_version-fabric:$jei_version"); break
        case "rei": modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"); break
        case "emi": modLocalRuntime("dev.emi:emi-fabric:$emi_version"); break
        case "disabled": break
        default: println("Unknown recipe viewer specified: $recipe_viewer. Must be JEI, REI, EMI, or disabled.")
    }
}

processResources {
    Map<String, Object> properties = [
            "version"              : version,
            "mod_version"          : mod_version,
            "fabric_loader_version": fabric_loader_version,
            "fabric_api_version"   : fabric_api_version,
            "create_version"       : create_version,
            "minecraft_version"    : minecraft_version
    ]

    inputs.properties(properties)

    filesMatching("fabric.mod.json") {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "$archives_base_name-fabric"
            from components.java
        }
    }

    repositories {
        if (project.hasProperty("mavendir")) {
            maven { url mavendir }
        }
    }
}
