# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod Info
maven_group = com.chocoboy.create_henry
archives_base_name = Create-Henry
mod_version = 1.0.3

minecraft_version = 1.20.1

# Fabric
# https://fabricmc.net/develop
fabric_loader_version = 0.17.2
fabric_api_version = 0.92.6+1.20.1

# Mappings
# https://parchmentmc.org/docs/getting-started
parchment_version = 2023.06.26

# Create Fabric (Modrinth maven: maven.modrinth:create-fabric)
# https://modrinth.com/mod/create-fabric/versions
create_version = 6.0.8.1+build.1744-mc1.20.1
# Create major.minor line, used only in the jar file name
create = 6.0

# Create platform libraries (createmod maven). Create Fabric bundles these via JIJ; declared
# explicitly so they are on the compile classpath.
catnip_version = 0.8.44
ponder_version = 1.0.91
flywheel_version = 1.0.5

# Registrate (Create fork, devos snapshots: com.tterrag.registrate_fabric:Registrate)
# This is the exact build Create Fabric 6.0.8 ships.
registrate_version = 1.3.79-MC1.20.1

# Forge Config API Port (Fabric) - lets the existing ForgeConfigSpec config code compile.
# Matches the version Create Fabric 6.0.8 bundles.
forge_config_api_port_version = 8.0.0

# Porting Lib (matches the modules Create Fabric 6.0.8 bundles)
porting_lib_version = 2.3.13+1.20.1

# milk-lib (Create JIJ dependency; needed at dev runtime, devos snapshots maven)
milk_lib_version = 1.2.60

# Development QOL
# Create supports all 3 recipe viewers: JEI, REI, and EMI. This decides which is enabled at runtime.
# Set to 'disabled' to have none of them.
recipe_viewer = jei
# JEI (Fabric) - https://maven.blamejared.com/mezz/jei/jei-1.20.1-fabric/
jei_version = 15.19.5.99
# REI - https://modrinth.com/mod/rei/versions
rei_version = 12.0.684
# EMI (maven.terraformersmc.com: dev.emi:emi-fabric) - https://modrinth.com/mod/emi/versions
emi_version = 1.1.24+1.20.1

# Mod Menu - https://modrinth.com/mod/modmenu/versions
modmenu_version = 7.2.2
